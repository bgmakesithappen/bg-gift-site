<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Thanks! - Ben's Gift Wishlist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #E8E4DD;
            color: #3A3A3A;
            padding: 2rem;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #3A3A3A;
            margin-bottom: 1rem;
        }

        p {
            color: #5a5a5a;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-block;
            padding: 1rem 2rem;
            background: #E85A3C;
            border-radius: 0.75rem;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #d14a2e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thanks!</h1>
        <p>Your wishlist has been sent. I'll check it out!</p>
        <a href="/" class="back-link">Back to Wishlist</a>
    </div>
</body>
</html>
